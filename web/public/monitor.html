<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Monitor · MN Technology</title>
  <meta name="theme-color" content="#7c3aed">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/monitor.css">
  <script src="/tema.js"></script>
  <script type="module" src="/monitor.js"></script>
</head>
<body>
  <header class="m-top">
    <div class="m-top-inner">
      <div class="m-brand">
        <img class="m-logo" src="/logo-mn-monograma.png" alt="MN Technology" width="62" height="40">
        <div>
          <h1>Monitor de la web</h1>
          <p class="m-sub"><span class="m-estado-punto" id="estado-punto" aria-hidden="true"></span><span id="resumen">Conectando…</span></p>
        </div>
      </div>
      <div class="m-acciones">
        <span class="m-hora" id="hora">—</span>
        <button class="tema-btn m-sec" type="button" data-tema aria-label="Cambiar tema" aria-pressed="false">
          <svg class="sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
        </button>
        <button type="button" id="pausa">Pausar</button>
        <button type="button" id="salir" class="m-sec">Salir</button>
      </div>
    </div>
  </header>

  <form class="m-login" id="login" hidden>
    <h2>Clave del monitor</h2>
    <p>Es la variable <code>MONITOR_CLAVE</code> del proyecto en Cloudflare Pages.</p>
    <input type="password" id="clave" autocomplete="current-password" required aria-label="Clave del monitor">
    <button type="submit">Entrar</button>
    <p class="m-error" id="login-error" role="alert"></p>
  </form>

  <main id="panel" hidden>
    <section class="m-kpis" id="kpis" aria-label="Resumen"></section>

    <div class="m-fila m-fila-principal">
      <section class="m-card m-trafico" aria-labelledby="t-trafico">
        <div class="m-card-head">
          <h2 id="t-trafico">Tráfico</h2>
          <div class="m-tabs" role="tablist" aria-label="Periodo">
            <button type="button" role="tab" data-rango="hora" aria-selected="true">Última hora</button>
            <button type="button" role="tab" data-rango="dia" aria-selected="false">24 horas</button>
            <button type="button" role="tab" data-rango="semana" aria-selected="false">7 días</button>
          </div>
        </div>
        <div id="trafico"></div>
      </section>

      <section class="m-card m-servicios" aria-labelledby="t-servicios">
        <div class="m-card-head"><h2 id="t-servicios">Servicios</h2><span class="m-nota" id="uptime"></span></div>
        <ul class="m-svc" id="servicios"></ul>
      </section>
    </div>

    <div class="m-fila m-fila-3" id="audiencia"></div>

    <section class="m-card" aria-labelledby="t-inventario">
      <div class="m-card-head"><h2 id="t-inventario">Inventario publicado</h2><span class="m-nota">Lo que la web muestra ahora</span></div>
      <div id="inventario"></div>
    </section>

    <section class="m-card" aria-labelledby="t-eventos">
      <div class="m-card-head"><h2 id="t-eventos">Cambios de estado</h2></div>
      <ol class="m-eventos" id="eventos"><li class="m-vacio">Sin cambios desde que abriste el panel.</li></ol>
    </section>
  </main>
  <div class="m-tooltip" id="tooltip" role="status" hidden></div>
</body>
</html>
